name: Release

# Publiceert de Docker-images van de API en de website naar de GitHub Container
# Registry (ghcr.io) na een merge naar main, en bij een versietag (v1.2.3).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.name }}-image publiceren
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Inloggen bij ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De repo heet "clockit." met een punt; die hoort niet in een imagenaam.
      # Daarom zetten we de naam zelf samen: ghcr.io/<eigenaar>/klokit-<onderdeel>.
      - name: Imagenaam bepalen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/klokit-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Bouwen en publiceren
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Samenvatting
        run: |
          {
            echo "### ${{ matrix.name }}-image gepubliceerd"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Mobile release

# Bouwt de Expo-app via EAS Build in de cloud. Geen Xcode of Android Studio nodig.
#
# Eenmalig instellen voordat dit werkt:
#   1. cd mobile && npx eas-cli@latest init      (zet extra.eas.projectId in app.json)
#   2. Maak een token op https://expo.dev/settings/access-tokens
#   3. Zet dat token als repository secret EXPO_TOKEN
#
# Handmatig starten via de Actions-tab, of automatisch bij een versietag (v1.2.3).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build-profiel uit mobile/eas.json
        type: choice
        default: preview
        options: [development, preview, production]
      platform:
        description: Platform om te bouwen
        type: choice
        default: all
        options: [all, android, ios]
  push:
    tags: ['v*.*.*']

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Controleren of EXPO_TOKEN is ingesteld
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN ontbreekt. Maak een token op https://expo.dev/settings/access-tokens" >&2
            echo "en zet het als repository secret EXPO_TOKEN." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: EAS CLI installeren
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Pakketten installeren
        working-directory: mobile
        run: npm ci

      # Laatste vangnet: niet bouwen als de tests of types stuk zijn.
      - name: Tests en typecheck
        working-directory: mobile
        run: |
          npm run typecheck
          npm test

      - name: Build starten
        working-directory: mobile
        run: |
          npx eas-cli@latest build \
            --profile "${{ inputs.profile || 'production' }}" \
            --platform "${{ inputs.platform || 'all' }}" \
            --non-interactive \
            --no-wait

      - name: Samenvatting
        run: |
          {
            echo "### EAS Build gestart"
            echo
            echo "- Profiel: \`${{ inputs.profile || 'production' }}\`"
            echo "- Platform: \`${{ inputs.platform || 'all' }}\`"
            echo
            echo "Volg de voortgang op https://expo.dev/accounts"
          } >> "$GITHUB_STEP_SUMMARY"

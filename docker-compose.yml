services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-clockit}
      MYSQL_USER: ${DB_USER:-clockit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-clockit}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootclockit}
      TZ: UTC
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-clockit}
      DB_USER: ${DB_USER:-clockit}
      DB_PASSWORD: ${DB_PASSWORD:-clockit}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-verander-mij}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_TIMEZONE: Europe/Amsterdam
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # Gebouwde website (nginx). Niet standaard: `npm start` draait de site met Vite, zodat
  # wijzigingen direct zichtbaar zijn. Productieversie testen: docker compose --profile prod up -d --build web
  web:
    build: ./frontend
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - api

volumes:
  db-data:

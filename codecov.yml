# Codecov-instellingen. De harde drempel van 80% staat in de testconfiguratie zelf
# (backend/vitest.config.ts, frontend/vitest.config.ts, mobile/jest.config.js), zodat
# je die lokaal net zo hard voelt als in CI. Codecov geeft hier het overzicht per
# onderdeel en zet een melding bij de pull request.
coverage:
  precision: 2
  round: down
  range: '80...100'

  status:
    project:
      default:
        target: 80%
        # Kleine schommelingen mogen de build niet blokkeren.
        threshold: 1%
      backend:
        target: 80%
        threshold: 1%
        flags: [backend]
      frontend:
        target: 80%
        threshold: 1%
        flags: [frontend]
      mobile:
        target: 80%
        threshold: 1%
        flags: [mobile]

    # Nieuwe of gewijzigde regels in een PR moeten voor 80% getest zijn.
    patch:
      default:
        target: 80%
        threshold: 1%

flags:
  backend:
    paths: [backend/src]
    carryforward: true
  frontend:
    paths: [frontend/src]
    carryforward: true
  mobile:
    paths: [mobile/src]
    carryforward: true

comment:
  layout: 'header, flags, diff, files'
  behavior: default
  require_changes: false

ignore:
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - 'backend/tests/**'
  - 'frontend/src/test/**'
  - '**/node_modules/**'
  - 'db/**'
  - 'scripts/**'
